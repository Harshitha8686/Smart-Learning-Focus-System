<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Streak</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="menu-icon">
            <i class="fas fa-bars"></i>
        </div>
        <h1>MOVIE STREAK.</h1>
        <div class="search-container">
            <input type="text" placeholder="Search (movie, genre, director etc.)">
            <button class="prev-btn"><i class="fas fa-arrow-up"></i> Previous</button>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <!-- Review Section -->
        <section class="review-section">
            <h2>REVIEW.</h2>
            <p>Paul Atreides arrives on Arrakis after his father accepts the stewardship of the dangerous planet. However, chaos ensues after a betrayal as forces clash to control melange, a precious resource.</p>
            <p><strong>Rating:</strong> 8.0/10</p>
        </section>

        <!-- Poster Section -->
        <section class="poster-section">
            <h2>POSTER.</h2>
            <div class="poster">
                <!-- Placeholder for movie poster -->
                <img src="https://th.bing.com/th/id/OIP.KTZo7lul80x1TCoW1jNf3QAAAA?w=204&h=306&c=8&rs=1&qlt=90&o=6&dpr=1.3&pid=3.1&rm=2">
            </div>
            <div class="poster-actions">
                <button id="watched-btn"><i class="fas fa-heart"></i> Watched</button>
                <button id="wishlist-btn"><i class="fas fa-plus"></i> Wishlist</button>
                <button id="next-btn"><i class="fas fa-arrow-down"></i> Next</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
